[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "convrag"
version = "0.1.0"
description = "Reproducible conversational passage retrieval for MTRAGEval"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "bm25s>=0.2,<0.4", "PyStemmer>=2,<4", "PyYAML>=6,<7", "requests>=2.31,<3", "tqdm>=4.66,<5", "pytrec-eval-terrier>=0.5.7,<0.6"]

[project.optional-dependencies]
neural = ["torch>=2.6,<3", "transformers>=4.51,<6", "sentence-transformers>=5,<6", "accelerate>=1,<2", "socksio>=1,<2"]
apple = ["mlx-lm>=0.21,<0.40"]
report = ["matplotlib>=3.8,<4", "reportlab>=4,<5"]
test = ["pytest>=8,<10"]

[project.scripts]
convrag = "convrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

